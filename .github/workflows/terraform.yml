name: Terraform

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    outputs:
      backend_repo:
        value: ${{ jobs.tf.outputs.backend_repo }}
      frontend_repo:
        value: ${{ jobs.tf.outputs.frontend_repo }}
      cluster_name: 
        value: ${{ jobs.tf.outputs.cluster_name }}  
      role: 
        value: ${{ jobs.tf.outputs.role }} 
        

permissions:
  id-token: write
  contents: read

jobs:
  tf:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./infra/envs/${{ inputs.environment }} 

    outputs:
      backend_repo: ${{ steps.out.outputs.backend_repo }}
      frontend_repo: ${{ steps.out.outputs.frontend_repo }}
      cluster_name: ${{ steps.out.outputs.cluster_name }}
      role: ${{ steps.role_ID.outputs.deploy_role_arn }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate terraform.tfvars
        run: |
          cat <<EOF > terraform.tfvars
          project = "${{ secrets.TF_VAR_PROJECT }}"
          region = "${{ secrets.TF_VAR_REGION }}"
          github_org = "${{ secrets.TF_VAR_GITHUB_ORG }}"
          github_repo = "${{ secrets.TF_VAR_GITHUB_REPO }}"
          subnet_ids = "${{ secrets.TF_VAR_SUBNET_IDS }}"
          public_subnet_tags_1 = {
            Name = "public-subnet-1-${{ inputs.environment }}"
          }
          public_subnet_tags_2 = {
            Name = "public-subnet-2-${{ inputs.environment }}"
          }
          igw_tags = {
            Name = "igw-${{ inputs.environment }}"
          }
          rt_tags = {
            Name = "rt-${{ inputs.environment }}"
          }
          sg_tags = {
            Name = "sg-${{ inputs.environment }}"
          }
          EOF

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE }}
          aws-region: us-east-1     
        
      - name: Configure Terraform  
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate  

      - name: Terraform Plan
        run: terraform plan -var "environment=${{ inputs.environment }}" -input=false

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var "environment=${{ inputs.environment }}"

      - name: Export ECR URLs output
        id: out
        run: |
          echo "backend_repo=$(terraform output -raw backend_repo_url -no-color)" >> $GITHUB_OUTPUT
          echo "frontend_repo=$(terraform output -raw frontend_repo_url -no-color)" >> $GITHUB_OUTPUT
          echo "cluster_name=$(terraform output -raw cluster_name -no-color)" >> $GITHUB_OUTPUT

      - name: Export role output based on branch
        id: role_ID
        run: |
          echo "deploy_role_arn=$(terraform output -raw role -no-color)" >> $GITHUB_OUTPUT    