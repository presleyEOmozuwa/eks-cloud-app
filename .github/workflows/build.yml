name: Build

on:
  workflow_call:
    inputs:
      backend_repo:
        required: true
        type: string
      
      frontend_repo:
        required: true
        type: string
      
      role:
        required: true
        type: string  
    
    outputs:
      image_tag:
        value: ${{ jobs.build.outputs.tag }}

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.vars.outputs.TAG }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role }}
          aws-region: us-east-1
      
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3    

      - name: Set SHA tag
        id: vars
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ inputs.backend_repo }}:${{ steps.vars.outputs.TAG }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ inputs.backend_repo }}:cache
          cache-to: type=registry,ref=${{ inputs.backend_repo }}:cache,mode=max

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ inputs.frontend_repo }}:${{ steps.vars.outputs.TAG }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ inputs.frontend_repo }}:cache
          cache-to: type=registry,ref=${{ inputs.frontend_repo }}:cache,mode=max