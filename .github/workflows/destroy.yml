name: Destroy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string  

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./infra/envs/${{ inputs.environment }} 
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate terraform.tfvars
        run: |
          cat <<EOF > terraform.tfvars
          project     = "${{ secrets.TF_VAR_PROJECT }}"
          region      = "${{ secrets.TF_VAR_REGION }}"
          github_org  = "${{ secrets.TF_VAR_GITHUB_ORG }}"
          github_repo = "${{ secrets.TF_VAR_GITHUB_REPO }}"
          subnet_ids = ${{ secrets.TF_VAR_SUBNET_IDS }}
          public_subnet_tags_1 = {
            Name = "public-subnet-1-${{ inputs.environment }}"
          }
          public_subnet_tags_2 = {
            Name = "public-subnet-2-${{ inputs.environment }}"
          }
          igw_tags = {
            Name = "igw-${{ inputs.environment }}"
          }
          rt_tags = {
            Name = "rt-${{ inputs.environment }}"
          }
          sg_tags = {
            Name = "sg-${{ inputs.environment }}"
          }
          EOF  

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE }}
          aws-region: us-east-1   
      
      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3
      
      - name: Terraform init
        run: terraform init
      
      - name: Terraform Plan
        run: terraform plan -var "environment=${{ inputs.environment }}" -input=false
      
      - run: |
          terraform destroy -auto-approve \
            -var "environment=${{ inputs.environment }}"